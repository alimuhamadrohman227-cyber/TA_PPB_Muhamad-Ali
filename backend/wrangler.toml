name = "aplikasi-catatan-keuangan"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Env var default (nilai sensitif di-set via `wrangler secret put`)
NODE_ENV = "production"

# Daftar secret yang harus diisi via CLI sebelum deploy:
# npx wrangler secret put DATABASE_URL
# npx wrangler secret put JWT_SECRET
